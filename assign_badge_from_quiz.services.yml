services:
  assign_badge_from_quiz.quiz_settings_standardizer:
    class: Drupal\assign_badge_from_quiz\Service\QuizSettingsStandardizer
    arguments: ['@database']

  Drupal\assign_badge_from_quiz\Hook\QuizResultHook:
    class: Drupal\assign_badge_from_quiz\Hook\QuizResultHook
    autowire: true

  assign_badge_from_quiz.display_builder:
    # Service for building the custom display for quiz results.
    class: Drupal\assign_badge_from_quiz\QuizResultDisplayBuilder
    arguments: ['@logger.factory', '@config.factory']

  assign_badge_from_quiz.post_quiz_renderer:
    class: Drupal\assign_badge_from_quiz\Service\PostQuizRenderer
    arguments: ['@config.factory']

  assign_badge_from_quiz.quiz_result_subscriber:
    class: Drupal\assign_badge_from_quiz\EventSubscriber\QuizResultPageSubscriber
    arguments:
      - '@current_route_match'
      - '@assign_badge_from_quiz.post_quiz_renderer'
      - '@assign_badge_from_quiz.display_builder'
      - '@current_user'
      - '@entity_type.manager'
      - '@config.factory'
    tags:
      - { name: event_subscriber }

  assign_badge_from_quiz.quiz_canonical_redirect_subscriber:
    class: Drupal\assign_badge_from_quiz\EventSubscriber\QuizCanonicalRedirectSubscriber
    arguments:
      - '@current_user'
    tags:
      - { name: event_subscriber }

  assign_badge_from_quiz.documentation_action_tokens:
    class: Drupal\assign_badge_from_quiz\Service\DocumentationActionTokenService
    arguments: ['@config.factory', '@datetime.time']

  assign_badge_from_quiz.documentation_notifier:
    class: Drupal\assign_badge_from_quiz\Service\DocumentationNotifier
    arguments:
      - '@entity_type.manager'
      - '@plugin.manager.mail'
      - '@language_manager'
      - '@keyvalue'
      - '@logger.factory'
      - '@assign_badge_from_quiz.documentation_action_tokens'

  assign_badge_from_quiz.pending_documentation_finder:
    class: Drupal\assign_badge_from_quiz\Service\PendingDocumentationFinder
    arguments:
      - '@database'
      - '@entity_type.manager'

  assign_badge_from_quiz.documentation_reminder:
    class: Drupal\assign_badge_from_quiz\Service\DocumentationReminder
    arguments:
      - '@assign_badge_from_quiz.pending_documentation_finder'
      - '@assign_badge_from_quiz.documentation_notifier'
      - '@config.factory'
      - '@state'
      - '@plugin.manager.mail'
      - '@language_manager'
      - '@date.formatter'
      - '@logger.factory'
      - '@datetime.time'
